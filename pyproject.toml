[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "notecli"
version = "0.1.0"
description = "Jogue NoteQuest de forma interativa como um adventure game"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "agno>=2.5.8",
]

[project.scripts]
notecli = "notecli.main:main"
